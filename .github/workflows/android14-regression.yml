name: Android 14 regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y swig ninja-build
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build SDK and NDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Reconstruct and verify exact app source
        run: |
          bash scripts/bootstrap-from-upstream.sh
          bash scripts/verify-source-snapshots.sh .ghajarvpn-src
          bash .ghajarvpn-src/scripts/fetch-openvpn-native.sh .
      - name: Build emulator-only app and instrumentation APK
        working-directory: .ghajarvpn-src
        run: ./gradlew --no-daemon -Pghajar.demo=true -Pghajar.testAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the native app on Android 14
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/run-android14-regression.sh
      - name: Preserve runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-Android14-regression
          path: |
            .ghajarvpn-src/app/build/reports/androidTests
            .ghajarvpn-src/app/build/outputs/androidTest-results
            runtime-evidence
          if-no-files-found: warn
