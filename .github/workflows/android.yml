name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y swig ninja-build

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Restore complete VPN engine modules while preserving uploaded app
        run: |
          echo "Keeping the newly uploaded app source unchanged."
          chmod +x scripts/bootstrap-from-upstream.sh
          scripts/bootstrap-from-upstream.sh

          test -f .ghajarvpn-src/openvpn/src/main/java/de/blinkt/openvpn/core/OpenVPNService.java
          test -f .ghajarvpn-src/strongswan/src/frontends/android/app/src/main/java/org/strongswan/android/data/VpnProfile.java

          chmod +x .ghajarvpn-src/scripts/fetch-openvpn-native.sh
          .ghajarvpn-src/scripts/fetch-openvpn-native.sh .

          rm -rf openvpn strongswan
          cp -a .ghajarvpn-src/openvpn ./openvpn
          cp -a .ghajarvpn-src/strongswan ./strongswan
          rm -rf .ghajarvpn-src

      - name: Verify new uploaded app is the app being built
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/libs/gozarcore.aar
          test -f app/src/main/java/net/gozar/app/AppColors.kt
          test -f app/src/main/java/net/gozar/app/configtoolkit/Decoders.kt
          test -f app/src/main/java/net/gozar/app/freecfg/FreeConfigPipeline.kt
          test -f openvpn/src/main/java/de/blinkt/openvpn/core/OpenVPNService.java
          test -f strongswan/src/frontends/android/app/src/main/java/org/strongswan/android/data/VpnProfile.java
          echo "Uploaded app source preserved; complete OpenVPN/StrongSwan engines restored for compilation."

      - name: Build new uploaded source - Debug and Release
        run: gradle --no-daemon -Pghajar.demo=true :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Verify APKs
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No APKs found.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-NEW-UPLOADED-APP-Android8plus
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-new-uploaded-app-test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
