name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*', '1.0.0']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 27.3.13750724

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y swig ninja-build

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify strongSwan generated sources are committed
        run: |
          missing=0
          for f in \
            strongswan/src/libstrongswan/asn1/oid.c \
            strongswan/src/libstrongswan/asn1/oid.h \
            strongswan/src/libstrongswan/crypto/proposal/proposal_keywords_static.c \
            strongswan/src/libstrongswan/crypto/proposal/proposal_keywords_static.h \
            strongswan/src/libstrongswan/settings/settings_parser.c \
            strongswan/src/libstrongswan/settings/settings_parser.h \
            strongswan/src/libstrongswan/settings/settings_lexer.c \
            strongswan/Android.common.mk \
            strongswan/src/frontends/android/app/src/main/jni/openssl/Android.mk
          do
            if [ ! -f "$f" ]; then
              echo "::error::missing generated source: $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Generate these locally and commit with 'git add -f'."
            exit 1
          fi
          echo "All strongSwan generated sources present."

      - name: Verify prebuilt native engine AAR
        run: |
          if [ ! -f app/libs/ca.psiphon.aar ]; then
            echo "::error::app/libs/ca.psiphon.aar is missing. Build it with gomobile and commit it."
            exit 1
          fi
          ls -lh app/libs/ca.psiphon.aar

      # The zeptun tun engine (MIT, Noisemux/zeptun), pinned to one commit and
      # built from source rather than vendored: it is Zig, and a committed
      # binary nobody can reproduce is worse than a build step. Its own CI
      # builds Android exactly this way. The engine is additive - the existing
      # Xray tun path does not use it - so a failure here must not be able to
      # break the app: the libraries simply will not be in the APK, and
      # ZeptunEngine reports itself unavailable at runtime.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build the zeptun tun engine
        env:
          ZEPTUN_COMMIT: 2798fc0ced2e39b2f55f3c1c1bcec45f91021400
        run: |
          git clone https://github.com/Noisemux/zeptun /tmp/zeptun
          git -C /tmp/zeptun checkout "$ZEPTUN_COMMIT"
          cd /tmp/zeptun
          # Only the two ABIs this app ships; building x86 as well would double
          # the step for emulators the release never targets.
          ABIS="armeabi-v7a arm64-v8a" sh scripts/build_android.sh
          for abi in armeabi-v7a arm64-v8a; do
            dest="$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp "zig-out/android/jniLibs/$abi/libzeptun.so" "$dest/"
            cp "zig-out/android/jniLibs/$abi/libzeptun-jni.so" "$dest/"
            # Android 15 requires 16 KB load alignment; zeptun's own CI checks
            # this and so does this one, because a library that fails to load
            # on a new phone would be indistinguishable from one not built.
            for so in "$dest/libzeptun.so" "$dest/libzeptun-jni.so"; do
              align=$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF; exit }')
              echo "$so $align"
              [ "$align" = "0x4000" ]
            done
          done
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs"/*/libzeptun*.so

      # sing-box (SagerNet/sing-box, GPL-3.0), built from source at a pinned
      # commit into the same kind of gomobile AAR its own Android client uses.
      # This is a second core alongside Xray, not a replacement: it is the only
      # way to get Snell, AnyTLS, ShadowTLS, ShadowsocksR and - the one that
      # needed a whole engine rather than a config field - OpenConnect, which
      # is Cisco AnyConnect's protocol and has nothing to do with Xray.
      #
      # Built rather than vendored for the same reason as zeptun: a committed
      # 100 MB binary nobody can reproduce is worse than a build step.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Build the sing-box core
        run: sh scripts/build-singbox.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-Android-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    needs: build
    # A manual run can publish too. Pushing a tag requires write access to
    # tag refs, which is a separate permission from pushing a branch, and an
    # operator who does not have it would otherwise be unable to release at
    # all. The tag to publish under is derived from versionName in that case,
    # so a dispatch cannot invent a version the build does not carry.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/tags/1.0.0' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dhttp.proxyHost= -Dhttps.proxyHost="
    steps:
      - uses: actions/checkout@v4

      # First step in the job, on purpose. Run 35437309288 spent nine minutes
      # building zeptun, sing-box and the whole app before Gradle died on an
      # empty keystore, and the message it died with was
      # "Tag number over 30 is not supported" - a DER parse error that says
      # nothing about the actual cause. The four signing secrets are checked
      # here, before anything expensive, and the failure names them.
      #
      # Only whether each secret is empty is tested. No value is ever echoed,
      # compared against a literal, or written anywhere.
      # First step in the job, on purpose. Run 35437309288 spent nine minutes
      # building zeptun, sing-box and the whole app before Gradle died on an
      # empty keystore, with "Tag number over 30 is not supported" - a DER
      # parse error that says nothing about the cause. The signing material is
      # checked here, before anything expensive.
      #
      # Two accepted shapes, in this order:
      #
      #   SIGNING_BUNDLE   one secret, "<store-password>:<base64 of the .jks>".
      #                    One secret is one paste, which is the whole point:
      #                    four separate secrets is four chances to set none.
      #                    Base64 has no ':' in its alphabet, so splitting at
      #                    the first one is unambiguous.
      #
      #   KEYSTORE_BASE64 + KEYSTORE_PASSWORD + KEY_ALIAS + KEY_PASSWORD
      #                    the original four. Still honoured, so a repository
      #                    already configured that way keeps working.
      #
      # Only emptiness is tested. No value is echoed or compared to a literal.
      - name: Check the signing material is present
        env:
          SIGNING_BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_BUNDLE" ]; then
            echo "Using SIGNING_BUNDLE."
            echo "SIGNING_MODE=bundle" >> "$GITHUB_ENV"
            exit 0
          fi
          missing=
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Cannot sign a release. No SIGNING_BUNDLE, and these are unset or empty:$missing"
            echo "::error::Simplest fix: add one secret named SIGNING_BUNDLE with the value <password>:<base64-of-release.jks>"
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "Using the four classic signing secrets."
          echo "SIGNING_MODE=classic" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y swig ninja-build

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify prebuilt native engine AAR
        run: |
          if [ ! -f app/libs/ca.psiphon.aar ]; then
            echo "::error::app/libs/ca.psiphon.aar is missing. Build it with gomobile and commit it."
            exit 1
          fi

      # Both built-from-source cores have to be built here too, not only in
      # the build job. zeptun was missing from this job, which meant every
      # signed release APK shipped without it while the debug artifact had it -
      # the one build nobody would think to check. sing-box is a compile-time
      # dependency on top of that, so without it this job cannot build at all.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build the zeptun tun engine
        env:
          ZEPTUN_COMMIT: 2798fc0ced2e39b2f55f3c1c1bcec45f91021400
        run: |
          git clone https://github.com/Noisemux/zeptun /tmp/zeptun
          git -C /tmp/zeptun checkout "$ZEPTUN_COMMIT"
          cd /tmp/zeptun
          ABIS="armeabi-v7a arm64-v8a" sh scripts/build_android.sh
          for abi in armeabi-v7a arm64-v8a; do
            dest="$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp "zig-out/android/jniLibs/$abi/libzeptun.so" "$dest/"
            cp "zig-out/android/jniLibs/$abi/libzeptun-jni.so" "$dest/"
            for so in "$dest/libzeptun.so" "$dest/libzeptun-jni.so"; do
              align=$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF; exit }')
              echo "$so $align"
              [ "$align" = "0x4000" ]
            done
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Build the sing-box core
        run: sh scripts/build-singbox.sh

      - name: Remove any committed local signing config
        run: rm -f keystore.properties

      - name: Read version from build.gradle.kts
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME versionCode=$CODE"

      # On a tag push the tag must agree with versionName, which is the check
      # that stops a v1.2.3 tag shipping a 1.0.0 build. On a manual run there
      # is no tag to check, so the tag to publish under is taken *from*
      # versionName - a dispatch therefore cannot publish under a version the
      # build does not actually carry.
      - name: Decide the release tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=${{ steps.version.outputs.name }}" >> "$GITHUB_OUTPUT"
            echo "Manual run: publishing under ${{ steps.version.outputs.name }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "${{ steps.version.outputs.name }}" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName ${{ steps.version.outputs.name }} in app/build.gradle.kts"
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # base64 -d on empty input exits 0 and writes a zero-byte file, which is
      # how run 35437309288 reached Gradle at all. Decoding is checked, and so
      # is the result: a file that is not a readable keystore, or one without
      # the expected alias, is reported here rather than as an opaque ASN.1
      # error from the packaging task.
      #
      # The material is written to keystore.properties rather than exported as
      # environment variables, which app/build.gradle.kts already supports as
      # its second path. That is deliberate: Actions prints a step's `env:`
      # block into the log, and while a real secret renders as ***, a value
      # this job derived itself would not be masked unless every branch
      # remembers ::add-mask::. Not putting it there at all removes the
      # question. The file is deleted in the cleanup step.
      - name: Unpack and verify the signing material
        env:
          SIGNING_BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          JKS="$RUNNER_TEMP/release.jks"
          if [ "$SIGNING_MODE" = "bundle" ]; then
            PW="${SIGNING_BUNDLE%%:*}"
            B64="${SIGNING_BUNDLE#*:}"
            ALIAS="${SIGNING_ALIAS:-ghajar}"
            if [ -z "$PW" ] || [ "$B64" = "$SIGNING_BUNDLE" ]; then
              echo "::error::SIGNING_BUNDLE must look like <password>:<base64-of-release.jks>"
              exit 1
            fi
          else
            PW="$KEYSTORE_PASSWORD"
            B64="$KEYSTORE_BASE64"
            ALIAS="$KEY_ALIAS"
          fi
          # Masked before it can reach any log line, whichever branch set it.
          echo "::add-mask::$PW"

          printf '%s' "$B64" | base64 -d > "$JKS" || {
            echo "::error::The keystore is not valid base64. Produce it with: base64 -w0 release.jks"
            exit 1
          }
          if [ ! -s "$JKS" ]; then
            echo "::error::The decoded keystore is empty (zero bytes)."
            exit 1
          fi
          echo "Decoded keystore: $(stat -c%s "$JKS") bytes."
          if ! keytool -list -keystore "$JKS" -storepass "$PW" >/dev/null 2>&1; then
            echo "::error::The decoded file is not a keystore that opens with that password."
            exit 1
          fi
          if ! keytool -list -keystore "$JKS" -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore opened but has no key under alias '$ALIAS'."
            exit 1
          fi
          # Recorded so the release notes and the verify step can be checked
          # against it. A certificate fingerprint is public by nature - it is
          # what every installed copy of the app already shows.
          keytool -list -keystore "$JKS" -storepass "$PW" -alias "$ALIAS" -v 2>/dev/null \
            | grep -E 'SHA256:' | head -1
          {
            echo "storeFile=$JKS"
            echo "storePassword=$PW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$PW"
          } > keystore.properties
          echo "Signing material is ready."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No signing variables in this step's environment. Gradle reads
      # keystore.properties, written by the step above.
      - name: Build signed release
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs and generate checksums
        run: |
          V="${{ steps.version.outputs.name }}"
          OUT=dist
          mkdir -p "$OUT"
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            base=$(basename "$apk")
            abi=$(echo "$base" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' || echo universal)
            cp "$apk" "$OUT/Ghajarvpn-${V}-${abi}.apk"
          done
          cd "$OUT"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK signatures
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$BT/apksigner" verify --print-certs "$apk" | head -4
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-release-v${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

      # The in-app updater reads this repository's releases/latest and picks
      # the asset matching the device's ABI, verifying it against the
      # SHA256SUMS.txt asset. Uploading the APKs as workflow artifacts alone
      # left nothing for it to find, so every tag built a release that the app
      # could never offer. This publishes them as release assets, which is
      # what UpdateChecker actually looks at.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.name }}"
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="GhajarVPN $V"
          NOTES=docs/release-notes/v$V.md
          # Create if it does not exist, otherwise update in place. The old
          # form failed outright on a re-run, because `gh release create`
          # errors when the release already exists - which meant one failed
          # publish left the tag permanently unreleasable without hand
          # intervention. --clobber replaces an asset of the same name.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; updating its assets and notes."
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --draft=false
            else
              gh release edit "$TAG" --title "$TITLE" --draft=false
            fi
            gh release upload "$TAG" dist/* --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file "$NOTES"
          else
            echo "::warning::No release notes at $NOTES; publishing with generated notes."
            gh release create "$TAG" dist/* --title "$TITLE" --generate-notes
          fi
          gh release view "$TAG" --json tagName,name,isDraft,assets \
            --jq '{tag:.tagName, title:.name, draft:.isDraft, assets:[.assets[].name]}'

      - name: Clean up secrets from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
