name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native prerequisites
        run: |
          APT_UBUNTU_OPTS=(
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources"
            -o Dir::Etc::sourceparts="-"
            -o APT::Get::List-Cleanup="0"
          )
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get "${APT_UBUNTU_OPTS[@]}" update
          sudo apt-get "${APT_UBUNTU_OPTS[@]}" install -y --no-install-recommends swig ninja-build rsync

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Materialize complete build tree and apply latest uploaded changes
        run: |
          chmod +x scripts/bootstrap-from-upstream.sh
          scripts/bootstrap-from-upstream.sh

          # Keep all previously reviewed app overlays, but do not let the five
          # placeholder snapshot files overwrite the complete reconstructed files.
          rsync -a \
            --exclude='main/java/net/gozar/app/MainActivity.kt' \
            --exclude='main/java/net/gozar/app/GozarVpnService.kt' \
            --exclude='main/java/net/gozar/app/Subscriptionrefresher.kt' \
            --exclude='main/java/net/gozar/app/Gozarapplication.kt' \
            --exclude='main/java/net/gozar/app/ConfigStore.kt' \
            app/src/ .ghajarvpn-src/app/src/
          rsync -a app/libs/ .ghajarvpn-src/app/libs/

          # Apply the exact source delta calculated from the newest uploaded ZIP
          # against the pinned reconstructed baseline.
          shopt -s nullglob
          patches=(patches/latest-upload/*.patch)
          if (( ${#patches[@]} != 5 )); then
            echo "Expected 5 latest-upload patches, found ${#patches[@]}" >&2
            exit 1
          fi
          for patch in "${patches[@]}"; do
            git -C .ghajarvpn-src apply --check "$GITHUB_WORKSPACE/$patch"
            git -C .ghajarvpn-src apply "$GITHUB_WORKSPACE/$patch"
          done

          # The reconstructed baseline already owns AppGreen in DotGlobe.kt.
          if [[ -f .ghajarvpn-src/app/src/main/java/net/gozar/app/DotGlobe.kt ]] && \
             grep -q 'val AppGreen' .ghajarvpn-src/app/src/main/java/net/gozar/app/DotGlobe.kt; then
            rm -f .ghajarvpn-src/app/src/main/java/net/gozar/app/AppColors.kt
          fi

          # Linux treats these as distinct files, but both declare IkeController.
          if [[ -f .ghajarvpn-src/app/src/main/java/net/gozar/app/IkeController.kt ]]; then
            rm -f .ghajarvpn-src/app/src/main/java/net/gozar/app/Ikecontroller.kt
          fi

          test -f .ghajarvpn-src/gradlew
          test -f .ghajarvpn-src/browser/build.gradle.kts
          test -f .ghajarvpn-src/app/libs/gozarcore.aar
          test -f .ghajarvpn-src/app/src/main/java/net/gozar/app/configcenter/ConfigNormalizer.kt
          test -f .ghajarvpn-src/app/src/main/java/net/gozar/app/freecfg/FreeConfigPipeline.kt
          chmod +x .ghajarvpn-src/gradlew

          # Byte-for-byte proof that the five newest uploaded files are exactly
          # the files that will be compiled into the APK.
          cd .ghajarvpn-src
          cat <<'SHA256' | sha256sum -c -
          ef0c31dfa85eacac9a505812c597aa4c83fc796b187c540a33ace9fd1ac20e48  app/src/main/java/net/gozar/app/MainActivity.kt
          6a77e5b8f144a85389a63a29aa188fb38a0bc47c1755126e5163ee94639d696b  app/src/main/java/net/gozar/app/GozarVpnService.kt
          5231734910241f05211dd1662e2d73b321bf08f791958512c55fb558eec07467  app/src/main/java/net/gozar/app/Subscriptionrefresher.kt
          e6d3b007ccd9cef2739c524f93b031731a80485db4217fa74f1b5ba49f8a6d9d  app/src/main/java/net/gozar/app/Gozarapplication.kt
          6d09995caa9f4c06232602d5dc5ec1d0afde416408c45fecafd0a698df088321  app/src/main/java/net/gozar/app/ConfigStore.kt
          SHA256
          echo 'Newest uploaded source changes verified byte-for-byte.'

      - name: Fetch pinned native OpenVPN engine sources
        run: |
          chmod +x .ghajarvpn-src/scripts/fetch-openvpn-native.sh
          .ghajarvpn-src/scripts/fetch-openvpn-native.sh .
          test -s .ghajarvpn-src/openvpn/src/main/cpp/openvpn3/client/ovpncli.i
          test -s .ghajarvpn-src/openvpn/src/main/cpp/openssl/openssl.cmake

      - name: Build latest uploaded GhajarVPN app
        working-directory: .ghajarvpn-src
        run: ./gradlew --no-daemon -Pghajar.demo=true :browser:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Verify APKs
        working-directory: .ghajarvpn-src
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No APKs found.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-LATEST-UPLOADED-CHANGES-Android8plus
          path: .ghajarvpn-src/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-latest-uploaded-changes-test-reports
          path: |
            .ghajarvpn-src/app/build/test-results/testDebugUnitTest/*.xml
            .ghajarvpn-src/browser/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
