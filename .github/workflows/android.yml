name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import latest uploaded GhajarVPN source changes
        run: |
          shopt -s nullglob
          parts=(.ci/import/ghajar-src5.b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo 'No staged upload payload; source is already materialized in the repository.'
          else
            cat "${parts[@]}" | base64 --decode > "$RUNNER_TEMP/ghajar-src5.tar.bz2"
            echo "f826823a2ffd422d040d4d17bbc31b3d87bc13b4b957c20cf41a2fa9e4648dae  $RUNNER_TEMP/ghajar-src5.tar.bz2" | sha256sum -c -

            mkdir -p "$RUNNER_TEMP/ghajar-import"
            tar -xjf "$RUNNER_TEMP/ghajar-src5.tar.bz2" -C "$RUNNER_TEMP/ghajar-import"

            src="$RUNNER_TEMP/ghajar-import/app/src/main/java/net/gozar/app"
            dst="app/src/main/java/net/gozar/app"
            files=(MainActivity.kt GozarVpnService.kt Subscriptionrefresher.kt Gozarapplication.kt ConfigStore.kt)
            for f in "${files[@]}"; do
              test -s "$src/$f"
              cp "$src/$f" "$dst/$f"
              cmp -s "$src/$f" "$dst/$f"
            done

            git config user.name "Ghajarvpn Build"
            git config user.email "build@ghajarvpn.local"
            git add \
              app/src/main/java/net/gozar/app/MainActivity.kt \
              app/src/main/java/net/gozar/app/GozarVpnService.kt \
              app/src/main/java/net/gozar/app/Subscriptionrefresher.kt \
              app/src/main/java/net/gozar/app/Gozarapplication.kt \
              app/src/main/java/net/gozar/app/ConfigStore.kt
            git rm -f .ci/import/ghajar-src5.b64.part-*
            git commit -m "feat: import latest uploaded GhajarVPN source changes"
            git push origin HEAD:main
            echo 'Latest uploaded source changes committed to main.'
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native prerequisites
        run: |
          # Restrict apt to Ubuntu's own archive. Hosted runners can temporarily
          # carry stale third-party indexes (e.g. Google Chrome), which are not
          # needed for this Android build and can cause Hash Sum mismatch errors.
          APT_UBUNTU_OPTS=(
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources"
            -o Dir::Etc::sourceparts="-"
            -o APT::Get::List-Cleanup="0"
          )
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get "${APT_UBUNTU_OPTS[@]}" update
          sudo apt-get "${APT_UBUNTU_OPTS[@]}" install -y --no-install-recommends swig ninja-build rsync

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Materialize complete build tree and overlay uploaded app
        run: |
          chmod +x scripts/bootstrap-from-upstream.sh
          scripts/bootstrap-from-upstream.sh

          # Keep the complete reviewed Gradle/browser/VPN tree, then overlay the
          # latest uploaded app source/resources from this repository.
          rsync -a app/src/ .ghajarvpn-src/app/src/
          rsync -a app/libs/ .ghajarvpn-src/app/libs/

          # The reconstructed baseline already owns AppGreen in DotGlobe.kt.
          # The uploaded AppColors.kt is a compatibility shim for incomplete
          # exports, so do not compile both declarations together.
          if [[ -f .ghajarvpn-src/app/src/main/java/net/gozar/app/DotGlobe.kt ]] && \
             grep -q 'val AppGreen' .ghajarvpn-src/app/src/main/java/net/gozar/app/DotGlobe.kt; then
            rm -f .ghajarvpn-src/app/src/main/java/net/gozar/app/AppColors.kt
          fi

          # Linux treats these as distinct files, but both declare IkeController.
          # Prefer the canonical-cased source.
          if [[ -f .ghajarvpn-src/app/src/main/java/net/gozar/app/IkeController.kt ]]; then
            rm -f .ghajarvpn-src/app/src/main/java/net/gozar/app/Ikecontroller.kt
          fi

          test -f .ghajarvpn-src/gradlew
          test -f .ghajarvpn-src/browser/build.gradle.kts
          test -f .ghajarvpn-src/app/libs/gozarcore.aar
          test -f .ghajarvpn-src/app/src/main/java/net/gozar/app/configcenter/ConfigNormalizer.kt
          test -f .ghajarvpn-src/app/src/main/java/net/gozar/app/freecfg/FreeConfigPipeline.kt
          chmod +x .ghajarvpn-src/gradlew

          # Prove every file from the newest uploaded ZIP is exactly what will compile.
          for f in MainActivity.kt GozarVpnService.kt Subscriptionrefresher.kt Gozarapplication.kt ConfigStore.kt; do
            cmp -s "app/src/main/java/net/gozar/app/$f" \
                   ".ghajarvpn-src/app/src/main/java/net/gozar/app/$f"
          done
          cmp -s app/src/main/java/net/gozar/app/freecfg/FreeConfigPipeline.kt \
                 .ghajarvpn-src/app/src/main/java/net/gozar/app/freecfg/FreeConfigPipeline.kt
          cmp -s app/src/main/java/net/gozar/app/GhajarLog.kt \
                 .ghajarvpn-src/app/src/main/java/net/gozar/app/GhajarLog.kt
          echo 'Latest uploaded app overlay verified.'

      - name: Fetch pinned native OpenVPN engine sources
        run: |
          chmod +x .ghajarvpn-src/scripts/fetch-openvpn-native.sh
          .ghajarvpn-src/scripts/fetch-openvpn-native.sh .
          test -s .ghajarvpn-src/openvpn/src/main/cpp/openvpn3/client/ovpncli.i
          test -s .ghajarvpn-src/openvpn/src/main/cpp/openssl/openssl.cmake

      - name: Build latest uploaded GhajarVPN app
        working-directory: .ghajarvpn-src
        run: ./gradlew --no-daemon -Pghajar.demo=true :browser:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Verify APKs
        working-directory: .ghajarvpn-src
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No APKs found.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-LATEST-UPLOADED-CHANGES-Android8plus
          path: .ghajarvpn-src/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-latest-uploaded-changes-test-reports
          path: |
            .ghajarvpn-src/app/build/test-results/testDebugUnitTest/*.xml
            .ghajarvpn-src/browser/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
