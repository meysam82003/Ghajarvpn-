name: Android CI

on:
  push:
    branches: [main, develop, ghajar-3.0.4-carousel-33-source, fix/release-1.0.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_demo:
        description: 'Build an updateable demo using the configured private demo key (main only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: trial_test_only
          MYSQL_DATABASE: trial_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptrial_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP MySQL driver
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql
      - name: Test per-panel trial quota under concurrent clients
        env:
          TRIAL_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=trial_test;charset=utf8mb4'
          TRIAL_TEST_USER: root
          TRIAL_TEST_PASSWORD: trial_test_only
        run: |
          php server/faoxima-1.0.0/tests/panel-trial.php
          php server/faoxima-1.0.0/tests/purchase-settlement.php
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Reject signed demos from non-main refs
        if: github.event_name == 'workflow_dispatch' && inputs.signed_demo && github.ref != 'refs/heads/main'
        run: |
          echo 'Signed demos are permitted only from main.' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v5
        with:
          # go1.26: psiphon-tls's init reflects over crypto/tls.ConnectionState
          # and panics (SIGABRT in libgojni at first use) under go1.27, whose
          # ConnectionState layout differs. Psiphon pins toolchain go1.26.3.
          go-version: '1.26.3'
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y swig ninja-build rsync
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Materialize complete build tree and overlay newest reviewed app sources
        run: |
          # The GitHub tree carries the reviewed patch distribution, so the
          # full engine sources are reconstructed from the pinned upstream.
          chmod +x scripts/bootstrap-from-upstream.sh
          scripts/bootstrap-from-upstream.sh
          # The visible app sources (including the newest uploaded changes)
          # are the canonical app overlay; the reviewed baseline owns the rest.
          rsync -a app/src/ .ghajarvpn-src/app/src/
          rsync -a app/libs/ .ghajarvpn-src/app/libs/
          python3 scripts/sync-release-build.py .ghajarvpn-src

          # The combined gomobile AAR (gozarcore Xray engine + Psiphon tunnel
          # in one Go runtime) replaces the inherited gozarcore.aar binary:
          # two gomobile AARs cannot coexist (duplicate go.Seq/libgojni.so).
          sed -i 's|implementation(files("libs/gozarcore.aar"))|implementation(files("libs/ca.psiphon.aar"))|' \
            .ghajarvpn-src/app/build.gradle.kts
          grep -q 'ca.psiphon.aar' .ghajarvpn-src/app/build.gradle.kts
          rm -f .ghajarvpn-src/app/libs/gozarcore.aar

          # The reconstructed baseline already owns AppGreen in DotGlobe.kt.
          if [[ -f .ghajarvpn-src/app/src/main/java/net/gozar/app/DotGlobe.kt ]] && \
             grep -q 'val AppGreen' .ghajarvpn-src/app/src/main/java/net/gozar/app/DotGlobe.kt; then
            rm -f .ghajarvpn-src/app/src/main/java/net/gozar/app/AppColors.kt
          fi

          # Linux treats these as distinct files, but both declare IkeController.
          if [[ -f .ghajarvpn-src/app/src/main/java/net/gozar/app/IkeController.kt ]]; then
            rm -f .ghajarvpn-src/app/src/main/java/net/gozar/app/Ikecontroller.kt
          fi

          echo "GHAJAR_SOURCE_ROOT=.ghajarvpn-src" >> "$GITHUB_ENV"
          test -f .ghajarvpn-src/gradlew
          test -f .ghajarvpn-src/browser/build.gradle.kts
          chmod +x .ghajarvpn-src/gradlew
      - name: Build combined gozarcore+psiphon AAR (ca.psiphon.aar)
        run: |
          # Psiphon tunnel-core fork on the shirokhorshid branch, pinned to a
          # reviewed commit so the Go/gomobile build stays reproducible.
          psiphon_sha='83aa73b9b982e7421e00117f5b0c5aceb5dda452'
          git clone --depth 1 -b shirokhorshid \
            https://github.com/CluvexStudio/psiphon-tunnel-core \
            "$RUNNER_TEMP/psiphon-tunnel-core"
          actual_sha="$(git -C "$RUNNER_TEMP/psiphon-tunnel-core" rev-parse HEAD)"
          if [ "$actual_sha" != "$psiphon_sha" ]; then
            echo "::error::psiphon-tunnel-core shirokhorshid moved: expected $psiphon_sha, got $actual_sha" >&2
            exit 1
          fi
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          # Match the app's Android 8+ (API 26) minSdk; a higher AAR minSdk
          # would fail the manifest merger against app/src/main/AndroidManifest.xml.
          export PSIPHON_ANDROID_API=26
          # Belt and suspenders: keep the whole Go build on the 1.26 toolchain.
          export GOTOOLCHAIN=go1.26.3
          chmod +x scripts/build-psiphon-aar.sh
          set -o pipefail
          ./scripts/build-psiphon-aar.sh .ghajarvpn-src "$RUNNER_TEMP/psiphon-tunnel-core" 2>&1 | tee "$RUNNER_TEMP/psiphon-build.log"
          test -s app/libs/ca.psiphon.aar
          test -s .ghajarvpn-src/app/libs/ca.psiphon.aar
          unzip -l .ghajarvpn-src/app/libs/ca.psiphon.aar | grep -E 'classes.jar|libgojni.so'
      - name: Verify reviewed app sources are compiled byte-for-byte
        run: |
          python3 scripts/verify-app-overlay.py .ghajarvpn-src
      - name: Install pinned Aether engine for Oblivion settings
        run: python3 scripts/fetch-aether-release.py .ghajarvpn-src
      - name: Check Faoxima compatibility PHP syntax
        run: |
          find server/faoxima-1.0.0/overlay -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -m py_compile server/faoxima-1.0.0/install.py
      - name: Verify OpenVPN remote-process contract
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = os.environ['GHAJAR_SOURCE_ROOT']
          manifest = os.path.join(root, 'openvpn/src/main/AndroidManifest.xml')
          tree = ET.parse(manifest)
          android = '{http://schemas.android.com/apk/res/android}'
          expected = {
              '.core.OpenVPNService',
              '.api.ExternalOpenVPNService',
              '.core.OpenVPNStatusService',
          }
          found = {}
          for service in tree.getroot().find('application').findall('service'):
              name = service.attrib.get(android + 'name')
              if name in expected:
                  found[name] = service.attrib.get(android + 'process')
          missing = expected - found.keys()
          if missing:
              raise SystemExit(f'Missing OpenVPN services: {sorted(missing)}')
          wrong = {name: proc for name, proc in found.items() if proc != ':openvpn'}
          if wrong:
              raise SystemExit(f'OpenVPN services must run in :openvpn: {wrong}')
          print('OpenVPN engine/status/API services are isolated in :openvpn')
          PY
      - name: Upload reconstructed OpenVPN integration sources
        if: env.GHAJAR_SOURCE_ROOT != '.'
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-openvpn-integration-sources
          path: |
            ${{ env.GHAJAR_SOURCE_ROOT }}/app/src/main/java/net/gozar/app/MainActivity.kt
            ${{ env.GHAJAR_SOURCE_ROOT }}/app/src/main/java/net/gozar/app/GhajarOpenVpnBridge.kt
            ${{ env.GHAJAR_SOURCE_ROOT }}/openvpn/src/main/AndroidManifest.xml
            ${{ env.GHAJAR_SOURCE_ROOT }}/openvpn/src/main/java/de/blinkt/openvpn/VpnProfile.java
            ${{ env.GHAJAR_SOURCE_ROOT }}/openvpn/src/main/java/de/blinkt/openvpn/LaunchVPN.java
            ${{ env.GHAJAR_SOURCE_ROOT }}/openvpn/src/main/java/de/blinkt/openvpn/core/OpenVPNService.java
            ${{ env.GHAJAR_SOURCE_ROOT }}/openvpn/src/main/java/de/blinkt/openvpn/core/VPNLaunchHelper.java
            ${{ env.GHAJAR_SOURCE_ROOT }}/openvpn/src/main/java/de/blinkt/openvpn/core/StatusListener.java
            ${{ env.GHAJAR_SOURCE_ROOT }}/openvpn/src/main/java/de/blinkt/openvpn/core/ProfileManager.java
          if-no-files-found: warn
      - name: Test OpenSSL architecture selection
        run: |
          cmake_bin="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          ctest_bin="$ANDROID_HOME/cmake/3.22.1/bin/ctest"
          "$cmake_bin" -S "$GHAJAR_SOURCE_ROOT/tests/native-arch" -B "$RUNNER_TEMP/ghajar-native-arch-tests"
          "$cmake_bin" --build "$RUNNER_TEMP/ghajar-native-arch-tests"
          "$ctest_bin" --test-dir "$RUNNER_TEMP/ghajar-native-arch-tests" --output-on-failure
      - name: Fetch pinned native OpenVPN engine sources
        if: env.GHAJAR_SOURCE_ROOT != '.'
        run: |
          test -f .ghajarvpn-src/scripts/fetch-openvpn-native.sh
          chmod +x .ghajarvpn-src/scripts/fetch-openvpn-native.sh
          .ghajarvpn-src/scripts/fetch-openvpn-native.sh .
          test -s .ghajarvpn-src/openvpn/src/main/cpp/openvpn3/client/ovpncli.i
          test -s .ghajarvpn-src/openvpn/src/main/cpp/openssl/openssl.cmake
      - name: Build Android 8+ Debug and R8 Release APKs (ephemeral test key)
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_demo
        working-directory: ${{ env.GHAJAR_SOURCE_ROOT }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon -Pghajar.demo=true :browser:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Prepare private demo signing key
        if: github.event_name == 'workflow_dispatch' && inputs.signed_demo && github.ref == 'refs/heads/main'
        env:
          DEMO_KEYSTORE_B64: ${{ secrets.GHAJAR_DEMO_KEYSTORE_B64 }}
          DEMO_STORE_PASSWORD: ${{ secrets.GHAJAR_DEMO_KEYSTORE_PASSWORD }}
          DEMO_KEY_ALIAS: ${{ secrets.GHAJAR_DEMO_KEY_ALIAS }}
          DEMO_KEY_PASSWORD: ${{ secrets.GHAJAR_DEMO_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Signed demos are permitted only from main.' >&2
            exit 1
          fi
          if [[ -z "$DEMO_KEYSTORE_B64" || -z "$DEMO_STORE_PASSWORD" || -z "$DEMO_KEY_ALIAS" || -z "$DEMO_KEY_PASSWORD" ]]; then
            echo 'Configure all four GHAJAR_DEMO signing secrets; no temporary key will be substituted.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$DEMO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ghajar-demo-signing.p12"
          test -s "$RUNNER_TEMP/ghajar-demo-signing.p12"
          echo "GHAJAR_DEMO_KEYSTORE_FILE=$RUNNER_TEMP/ghajar-demo-signing.p12" >> "$GITHUB_ENV"
      - name: Build Android 8+ signed demo APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_demo && github.ref == 'refs/heads/main'
        working-directory: ${{ env.GHAJAR_SOURCE_ROOT }}
        env:
          GHAJAR_DEMO_KEYSTORE_PASSWORD: ${{ secrets.GHAJAR_DEMO_KEYSTORE_PASSWORD }}
          GHAJAR_DEMO_KEY_ALIAS: ${{ secrets.GHAJAR_DEMO_KEY_ALIAS }}
          GHAJAR_DEMO_KEY_PASSWORD: ${{ secrets.GHAJAR_DEMO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -Pghajar.demo=true -Pghajar.demo.signed=true :browser:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug
      - name: Collect Kotlin compile errors
        if: failure()
        run: |
          set +e
          if [ -s "$RUNNER_TEMP/build.log" ]; then
            cp "$RUNNER_TEMP/build.log" "$GITHUB_WORKSPACE/kotlin-compile.log"
          elif [ -n "$GHAJAR_SOURCE_ROOT" ] && [ -d "$GHAJAR_SOURCE_ROOT" ]; then
            (cd "$GHAJAR_SOURCE_ROOT" && ./gradlew --no-daemon :app:compileDebugKotlin) > "$RUNNER_TEMP/build.log" 2>&1
            cp "$RUNNER_TEMP/build.log" "$GITHUB_WORKSPACE/kotlin-compile.log"
          fi
          cp "$RUNNER_TEMP"/*.log "$GITHUB_WORKSPACE"/ 2>/dev/null
          # Blob storage artifacts are unreachable from some networks; publish
          # the same log on a side branch so it stays fetchable via plain git.
          # NOTE: run from the Ghajarvpn checkout itself (not .ghajarvpn-src,
          # whose origin is the read-only upstream fork).
          git -C "$GITHUB_WORKSPACE" config user.name "CI Diagnostics"
          git -C "$GITHUB_WORKSPACE" config user.email "ci@ghajarvpn.local"
          git -C "$GITHUB_WORKSPACE" checkout --orphan ci-error-report
          git -C "$GITHUB_WORKSPACE" reset --quiet
          git -C "$GITHUB_WORKSPACE" add -f ./*.log
          git -C "$GITHUB_WORKSPACE" commit --quiet -m "build log from run ${GITHUB_RUN_ID}"
          git -C "$GITHUB_WORKSPACE" push --force origin ci-error-report
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kotlin-compile-errors
          path: kotlin-compile.log
          if-no-files-found: warn
      - name: Verify OpenVPN native launcher is packaged
        working-directory: ${{ env.GHAJAR_SOURCE_ROOT }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No debug APKs found.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            if ! unzip -l "$apk" | grep -Eq 'lib/[^/]+/libovpnexec\.so$'; then
              echo "OpenVPN native launcher libovpnexec.so is missing from $apk" >&2
              exit 1
            fi
            if ! unzip -l "$apk" | grep -Eq 'lib/[^/]+/libgojni\.so$'; then
              echo "Psiphon engine libgojni.so is missing from $apk" >&2
              exit 1
            fi
          done
      - name: Verify APK signatures and hashes
        working-directory: ${{ env.GHAJAR_SOURCE_ROOT }}
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            test -f "$apk" || continue
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-1.0.0-${{ github.event_name == 'workflow_dispatch' && inputs.signed_demo && 'signed-demo' || 'CI-ephemeral-key' }}-Android8plus
          path: ${{ env.GHAJAR_SOURCE_ROOT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Deliver arm64 release APK via git branch
        if: success() && github.ref == 'refs/heads/main'
        working-directory: ${{ env.GHAJAR_SOURCE_ROOT }}
        run: |
          # Blob-storage artifacts are unreachable from some networks; publish
          # the installable APK on a git side branch instead.
          apk="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s "$apk"
          git -C "$GITHUB_WORKSPACE" config user.name "CI Delivery"
          git -C "$GITHUB_WORKSPACE" config user.email "ci@ghajarvpn.local"
          git -C "$GITHUB_WORKSPACE" checkout --orphan apk-delivery
          git -C "$GITHUB_WORKSPACE" reset --quiet
          cp "$apk" "$GITHUB_WORKSPACE/Ghajarvpn-arm64-v8a-release.apk"
          git -C "$GITHUB_WORKSPACE" add -f Ghajarvpn-arm64-v8a-release.apk
          git -C "$GITHUB_WORKSPACE" commit --quiet -m "arm64 release APK from run ${GITHUB_RUN_ID}"
          git -C "$GITHUB_WORKSPACE" push --force origin apk-delivery
      - name: Upload server compatibility patch
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-1.0.0-Faoxima-server-patch
          path: server/faoxima-1.0.0/
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-1.0.0-test-reports
          path: |
            ${{ env.GHAJAR_SOURCE_ROOT }}/app/build/test-results/testDebugUnitTest/*.xml
            ${{ env.GHAJAR_SOURCE_ROOT }}/browser/build/test-results/testDebugUnitTest/*.xml
            ${{ runner.temp }}/ghajar-native-arch-tests/Testing/Temporary/LastTest.log
          if-no-files-found: warn
  draft-release:
    needs: [server-tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/release-1.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Ghajarvpn-1.0.0-CI-ephemeral-key-Android8plus
          path: release-apks
      - name: Package reviewed outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile
          out = Path('release-files'); out.mkdir()
          for apk in Path('release-apks').rglob('*release.apk'):
              shutil.copy2(apk, out / apk.name.replace('app-', 'Ghajarvpn-1.0.0-'))
          assert list(out.glob('*.apk')), 'No release APKs found'
          root = Path('server/faoxima-1.0.0')
          with zipfile.ZipFile(out / 'Ghajarvpn-1.0.0-server-patch.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for f in root.rglob('*'):
                  if f.is_file() and '__pycache__' not in f.parts:
                      z.write(f, 'Ghajarvpn-1.0.0-server-patch/' + str(f.relative_to(root)))
          (out / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(f.read_bytes()).hexdigest() + '  ' + f.name + '\n'
              for f in sorted(out.iterdir())))
          PY
      - name: Prepare draft 1.0.0 with APKs and server patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 1.0.0 --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "An existing published release must not be replaced"' "$RUNNER_TEMP/release-state.json"
            gh release edit 1.0.0 --draft --target "$GITHUB_SHA" --title '1.0.0' --notes-file docs/RELEASE-NOTES-1.0.0.md
            gh release upload 1.0.0 release-files/* --clobber
          else
            gh release create 1.0.0 release-files/* --draft --target "$GITHUB_SHA" --title '1.0.0' --notes-file docs/RELEASE-NOTES-1.0.0.md
          fi
