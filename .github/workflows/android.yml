name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y swig ninja-build
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Materialize full source when using the GitHub patch distribution
        run: |
          if [[ -f app/libs/gozarcore.aar ]]; then
            echo "GHAJAR_SOURCE_ROOT=." >> "$GITHUB_ENV"
          else
            chmod +x scripts/bootstrap-from-upstream.sh
            scripts/bootstrap-from-upstream.sh
            echo "GHAJAR_SOURCE_ROOT=.ghajarvpn-src" >> "$GITHUB_ENV"
          fi
      - name: Fetch pinned native OpenVPN engine sources
        if: env.GHAJAR_SOURCE_ROOT != '.'
        run: |
          test -f .ghajarvpn-src/scripts/fetch-openvpn-native.sh
          chmod +x .ghajarvpn-src/scripts/fetch-openvpn-native.sh
          .ghajarvpn-src/scripts/fetch-openvpn-native.sh .ghajarvpn-src
      - name: Build debug APK
        working-directory: ${{ env.GHAJAR_SOURCE_ROOT }}
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-Android-debug
          path: ${{ env.GHAJAR_SOURCE_ROOT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
