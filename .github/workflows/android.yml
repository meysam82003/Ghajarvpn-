name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Restore missing StrongSwan support tree only
        run: |
          if [[ ! -f strongswan/src/frontends/android/app/src/main/java/org/strongswan/android/data/VpnProfile.java ]]; then
            echo "StrongSwan export is incomplete; restoring only the StrongSwan module from the reviewed source distribution."
            chmod +x scripts/bootstrap-from-upstream.sh
            scripts/bootstrap-from-upstream.sh
            test -f .ghajarvpn-src/strongswan/src/frontends/android/app/src/main/java/org/strongswan/android/data/VpnProfile.java
            rm -rf strongswan
            cp -a .ghajarvpn-src/strongswan ./strongswan
            rm -rf .ghajarvpn-src
          fi

      - name: Verify uploaded app source is still the build source
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/libs/gozarcore.aar
          test -f app/src/main/java/net/gozar/app/AppColors.kt
          test -f app/src/main/java/net/gozar/app/configtoolkit/Decoders.kt
          test -f app/src/main/java/net/gozar/app/freecfg/FreeConfigPipeline.kt
          test -f openvpn/build.gradle.kts
          test -f strongswan/build.gradle.kts
          test -d openvpn/src/main/jniLibs/arm64-v8a
          test -d openvpn/src/main/jniLibs/armeabi-v7a
          echo "Building uploaded app/openvpn source directly; only missing StrongSwan support files were restored."

      - name: Build uploaded source - Debug and Release
        run: gradle --no-daemon -Pghajar.demo=true :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Verify APKs
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No APKs found.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-UPLOADED-SOURCE-Android8plus
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghajarvpn-uploaded-source-test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
