name: Ghajar App (Windows / macOS / Linux / Android TV / LG webOS / iPhone)

# Installable files of the Ghajar app, published to one GitHub Release
# (never marked "latest", so the Android release stays the latest one):
#   GhajarVPN-win-x64.exe, GhajarVPN-mac-arm64.dmg, GhajarVPN-mac-x64.dmg,
#   GhajarVPN-linux-x86_64.AppImage, GhajarVPN-webos.ipk,
#   GhajarVPN-AndroidTV-<abi>.apk (the main app from android.yml, which runs on TV),
#   GhajarVPN-iPhone.mobileconfig
on:
  push:
    branches: [main, 'claude/happy-ritchie-r51k5d']
    paths: ['web-desktop/**', 'web-webos/**', 'native/ghajar-helper/**', 'app/src/main/assets/geo*.dat', '.github/workflows/ghajar-app.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # the release job reads android.yml's artifacts

concurrency:
  group: ghajar-app-${{ github.ref }}
  cancel-in-progress: true

env:
  # sing-box's own release builds use 1.26.8; native/Psiphon asks for >= 1.26.3.
  GO_VERSION: '1.26.8'

jobs:
  # The VPN cores the desktop engine runs (web-desktop/engine/), built from
  # pinned sources by web-desktop/scripts/build-cores.sh into
  # web-desktop/core/<os>-<arch>/, which electron-builder packages as
  # Resources/core. Windows' Go cores are cross-compiled on Linux here; its
  # slipstream (Rust + MSVC-only picoquic) is built natively in
  # slipstream-win; the macOS cores are built on the macOS job itself, because
  # sing-box's NaiveProxy (static Cronet, cgo) and slipstream need Xcode.
  cores-win:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Go module and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: desktop-cores-go-win-${{ env.GO_VERSION }}-${{ hashFiles('web-desktop/scripts/build-cores.sh', 'native/ghajar-helper/go.sum') }}
          restore-keys: desktop-cores-go-win-${{ env.GO_VERSION }}-
      - name: Cores for win-x64 (cross-compiled)
        run: bash web-desktop/scripts/build-cores.sh win-x64
      # After build-cores.sh, which starts each core directory afresh.
      - name: Tor and Aether for win-x64 (optional, when their scripts exist)
        continue-on-error: true
        run: |
          for s in fetch-tor.sh build-aether-desktop.sh; do
            [ -f "web-desktop/scripts/$s" ] || continue
            bash "web-desktop/scripts/$s" win-x64 || echo "::warning::$s failed for win-x64; its protocols stay greyed out"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cores-win-x64
          path: web-desktop/core/win-x64
          retention-days: 3
          if-no-files-found: error

  # slipstream-client for Windows: upstream builds picoquic for Windows only
  # with MSVC and OpenSSL from vcpkg (its build.rs refuses anything else), so
  # this follows Mygod/slipstream-rust's own .github/actions/build-binary.
  # Optional: when it fails the app ships without slipstream on Windows.
  slipstream-win:
    # Upstream's picoquic script asks CMake for "Visual Studio 17 2022";
    # windows-latest now ships a newer Visual Studio only.
    runs-on: windows-2022
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          ref: 7de506b222c83ae97a19a618e33fe26899af1bd5 # same pin as scripts/build-slipstream.sh
          submodules: recursive
          path: slipstream
      - name: OpenSSL from vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          & $vcpkg install "pkgconf:x64-windows" "openssl:x64-windows-static-md"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed" }
          $opensslRoot = Join-Path $vcpkgRoot "installed\x64-windows-static-md"
          $pkgConfig = @((Join-Path $vcpkgRoot "installed\x64-windows\tools\pkgconf\pkgconf.exe"), (Join-Path $vcpkgRoot "installed\x64-windows\tools\pkgconf\pkg-config.exe")) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$pkgConfig) { throw "pkgconf not found" }
          "PKG_CONFIG=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_CONFIG_EXECUTABLE=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_CONFIG_PATH=$(Join-Path $opensslRoot 'lib\pkgconfig')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_INCLUDE_DIR=$(Join-Path $opensslRoot 'include')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_LIB_DIR=$(Join-Path $opensslRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: picoquic (MSVC)
        shell: pwsh
        working-directory: slipstream
        run: .\scripts\build_picoquic_windows.ps1 -Platform x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: slipstream-client
        shell: bash
        working-directory: slipstream
        run: |
          cargo build --release --locked -p slipstream-client --target x86_64-pc-windows-msvc
          mkdir -p ../out/licenses
          cp target/x86_64-pc-windows-msvc/release/slipstream-client.exe ../out/slipstream.exe
          cp LICENSE ../out/licenses/slipstream.txt
          ls -la ../out
      - name: No DLLs beyond Windows' own
        shell: pwsh
        working-directory: slipstream
        run: |
          New-Item -ItemType Directory -Force -Path check | Out-Null
          Copy-Item ..\out\slipstream.exe check\slipstream-client.exe
          ./scripts/verify_windows_artifact_deps.ps1 -DistDir check -TargetPlatform x64
      - uses: actions/upload-artifact@v4
        with:
          name: cores-win-x64-slipstream
          path: out
          retention-days: 3
          if-no-files-found: error

  # macOS and Linux: each job builds its own cores, then the installers.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            cores: mac-x64 mac-arm64
            rust: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04, not latest: slipstream (and Aether) link the build host's
          # glibc, so the oldest supported Ubuntu keeps the AppImage portable.
          - os: ubuntu-22.04
            target: linux
            cores: linux-x64
            rust: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: web-desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-desktop/package-lock.json
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Go module and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: desktop-cores-go-${{ matrix.target }}-${{ env.GO_VERSION }}-${{ hashFiles('web-desktop/scripts/build-cores.sh', 'native/ghajar-helper/go.sum') }}
          restore-keys: desktop-cores-go-${{ matrix.target }}-${{ env.GO_VERSION }}-
      # slipstream: Rust, with picoquic built by CMake and OpenSSL vendored.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: Cores (${{ matrix.cores }})
        run: bash scripts/build-cores.sh ${{ matrix.cores }}
      # After build-cores.sh, which starts each core directory afresh.
      - name: Tor and Aether (optional, when their scripts exist)
        continue-on-error: true
        run: |
          for s in fetch-tor.sh build-aether-desktop.sh; do
            [ -f "scripts/$s" ] || continue
            bash "scripts/$s" ${{ matrix.cores }} || echo "::warning::$s failed for ${{ matrix.cores }}; its protocols stay greyed out"
          done
      # Real connections with the cores just built: local proxy everywhere,
      # and the whole-device TUN plus chosen-apps mode on Linux (as root).
      - name: Connection test (engine end to end)
        continue-on-error: true
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            sudo env "PATH=$PATH" CI=true E2E_TUN=1 CORE_DIR=core/linux-x64 node engine/test/os-e2e.mjs
          else
            CORE_DIR=core/mac-$(uname -m | sed 's/x86_64/x64/') node engine/test/os-e2e.mjs
          fi
      - run: npm run dist:${{ matrix.target }}
      - name: iPhone profile
        if: matrix.target == 'linux'
        run: npm run ios-profile
      - uses: actions/upload-artifact@v4
        with:
          name: ghajar-app-${{ matrix.target }}
          path: |
            web-desktop/dist/*.dmg
            web-desktop/dist/*.AppImage
            web-desktop/dist/*.mobileconfig
          if-no-files-found: error

  # Windows: the cores come from cores-win (and slipstream-win, when it built).
  build-win:
    needs: [cores-win, slipstream-win]
    if: ${{ !cancelled() && needs.cores-win.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web-desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-desktop/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cores-win-x64
          path: web-desktop/core/win-x64
      - name: slipstream (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cores-win-x64-slipstream
          path: web-desktop/core/win-x64
      # Aether (WARP MASQUE/WireGuard) needs a native MSVC build: BoringSSL
      # is compiled for the host, so it cannot come from the Linux cross job.
      - name: Aether toolchain (optional)
        continue-on-error: true
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-msvc
      - name: Aether (optional)
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: bash scripts/build-aether-desktop.sh win-x64
      - name: Cores present
        shell: bash
        run: |
          ls -la core/win-x64 core/win-x64/licenses
          for f in xray.exe sing-box.exe geoip.dat geosite.dat; do
            test -s "core/win-x64/$f" || { echo "::error::core/win-x64/$f missing"; exit 1; }
          done
      # Real connections on Windows with the shipped cores: local proxy,
      # Windows system proxy, whole-device TUN and chosen-apps mode (the
      # runner is an administrator, so the elevation needs no prompt here).
      - name: Connection test (engine end to end)
        continue-on-error: true
        shell: bash
        run: CI=true CORE_DIR=core/win-x64 node engine/test/os-e2e.mjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ghajar-app-win
          path: web-desktop/dist/*.exe
          if-no-files-found: error

  # LG webOS: the Ghajar web app in TV mode, packaged with ares-package.
  webos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-webos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-webos/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ghajar-app-webos
          path: web-webos/dist/GhajarVPN-webos.ipk
          if-no-files-found: error

  release:
    needs: [build, build-win, webos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Only the installers: the cores-* artifacts are build inputs, not release files.
      - uses: actions/download-artifact@v4
        with:
          pattern: ghajar-app-*
          path: files
          merge-multiple: true
      # Android TV: the main app (app/, built by android.yml) runs on TV, so its
      # latest successful preview APKs from this branch (else the default
      # branch) are attached. Not fatal: without such a run there is no TV file.
      - name: Android TV APKs from android.yml
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run=""
          for branch in "$GITHUB_REF_NAME" "${{ github.event.repository.default_branch }}"; do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --branch "$branch" --status success -L1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && { echo "Android TV: android.yml run $run on $branch"; break; }
            echo "Android TV: no successful android.yml run on $branch"
          done
          if [ -z "$run" ]; then echo "::warning::No successful android.yml run found; the release has no Android TV APK."; exit 0; fi
          if ! gh run download "$run" -R "$GITHUB_REPOSITORY" -n Ghajarvpn-Android-preview -D tv; then
            echo "::warning::android.yml run $run has no Ghajarvpn-Android-preview artifact (expired?); no Android TV APK."; exit 0
          fi
          find tv -name '*.apk' -print
          for apk in $(find tv -name '*.apk'); do
            name=$(basename "$apk")
            abi=""
            for a in arm64-v8a armeabi-v7a x86_64 x86; do
              case "$name" in *"$a"*) abi=$a; break ;; esac
            done
            if [ -n "$abi" ]; then dest="files/GhajarVPN-AndroidTV-$abi.apk"; else dest="files/GhajarVPN-AndroidTV.apk"; fi
            cp "$apk" "$dest" && echo "Android TV: $name -> $(basename "$dest")"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./web-desktop/package.json').version")
          TAG="ghajar-app-v${VERSION}"
          TITLE="قاجار وی پی ان — نسخهٔ نصبی ویندوز، مک، لینوکس، اندروید تی‌وی، ال‌جی و آیفون ${VERSION}"
          cat > notes.md <<'NOTES'
          ## 💻 📺 نسخه‌های ویندوز، مک، لینوکس، اندروید تی‌وی و ال‌جی

          | دستگاه | فایل | روش |
          |---|---|---|
          | ویندوز | `GhajarVPN-win-x64.exe` | دانلود کن و باز کن؛ خودش نصب و اجرا می‌شود. اگر ویندوز هشدار داد: «More info» ← «Run anyway». |
          | مک (M1/M2/M3/M4) | `GhajarVPN-mac-arm64.dmg` | باز کن و قاجار را داخل Applications بکش. بار اول: روی برنامه راست‌کلیک ← Open ← Open (یا System Settings ← Privacy & Security ← Open Anyway). |
          | مک (اینتل) | `GhajarVPN-mac-x64.dmg` | مثل بالا. |
          | لینوکس | `GhajarVPN-linux-x86_64.AppImage` | اجازهٔ اجرا بده (Properties ← Allow executing) و باز کن. |
          | آیفون / آیپد | `GhajarVPN-iPhone.mobileconfig` | با Safari دانلود کن ← Allow ← Settings ← «Profile Downloaded» ← Install. آیکن قاجار روی صفحهٔ اصلی می‌آید. |
          | اندروید تی‌وی (ARM 64 بیتی، بیشتر تلویزیون‌ها) | `GhajarVPN-AndroidTV-arm64-v8a.apk` | با یک فایل‌منیجر یا «Send Files to TV» روی تلویزیون بریز و نصب کن (نصب از منابع ناشناس را روشن کن). |
          | اندروید تی‌وی (ARM 32 بیتی) | `GhajarVPN-AndroidTV-armeabi-v7a.apk` | مثل بالا، برای تلویزیون‌ها و باکس‌های قدیمی‌تر. |
          | تلویزیون ال‌جی (webOS) | `GhajarVPN-webos.ipk` | Developer Mode را روی تلویزیون فعال کن و با `ares-install GhajarVPN-webos.ipk` (یا webOS Dev Manager) نصب کن. |

          نسخهٔ کامپیوتر در سینی سیستم (کنار ساعت) می‌ماند تا اعلان‌ها برسند و با روشن شدن کامپیوتر خودش اجرا می‌شود؛ از منوی همان آیکن قابل خاموش کردن است.
          NOTES
          sed -i 's/^          //' notes.md
          ls -la files
          # The app's own release of the same version (e.g. 1.1.2, made by
          # android.yml for the phone APKs) gets these files too, next to the
          # phone APKs, which are left exactly as they are; its notes gain the
          # install table once, below the existing text.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" files/* --clobber
            body=$(gh release view "$VERSION" --json body --jq .body)
            if ! printf '%s' "$body" | grep -q 'ghajar-app-files'; then
              { printf '%s\n\n---\n<!-- ghajar-app-files -->\n' "$body"; cat notes.md; } > merged.md
              gh release edit "$VERSION" --notes-file merged.md
            fi
            gh release view "$VERSION" --json url,assets --jq '.url, (.assets[] | .name)'
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Files this release no longer ships.
            for gone in GhajarVPN-android.apk GhajarVPN-chrome-extension.zip GhajarVPN-firefox-extension.xpi; do
              gh release delete-asset "$TAG" "$gone" -y 2>/dev/null || true
            done
            gh release upload "$TAG" files/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --latest=false
          else
            gh release create "$TAG" files/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest=false
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | .name)'
