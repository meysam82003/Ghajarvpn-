name: Publish APK to Release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run id with APK artifact'
        required: true
      tag:
        description: 'Release tag (existing)'
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact and upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          gh run download "$RUN_ID" -n Ghajarvpn-3.0.4-CI-ephemeral-key-Android8plus -D apk
          APK=$(find apk -name '*.apk' | head -1)
          gh release upload "$TAG" "$APK" --clobber
